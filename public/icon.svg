<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="8"/>
  
  <!-- Subtle accent curves -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="rgba(251,191,36,0.15)" stroke-width="2" stroke-dasharray="8 8"/>
  
  <!-- Hindi Letter 'क' Emblem -->
  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Shirorekha (Top bar) -->
    <rect x="120" y="145" width="272" height="28" rx="8" />
    
    <!-- Central vertical stem -->
    <rect x="238" y="145" width="36" height="240" rx="6" />
    
    <!-- Left Loop of 'क' -->
    <path d="M 240 250 C 240 215 165 215 165 260 C 165 305 240 305 240 270 Z" fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right Tail curve of 'क' -->
    <path d="M 270 240 C 330 220 360 260 340 315 C 330 340 300 375 270 380" fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round"/>
  </g>
  
  <!-- Golden Live / News Dot Indicator -->
  <circle cx="370" cy="145" r="14" fill="#fbbf24" stroke="#ffffff" stroke-width="3"/>
  <circle cx="370" cy="145" r="22" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.6"/>
  
  <!-- Bottom Text Label -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#fef08a" text-anchor="middle" letter-spacing="4">KABIRA NEWS</text>
</svg>
