name: Kabira News 24/7 Automated Publisher

# Trigger on a 30-minute cron schedule and allow manual execution
on:
  schedule:
    # Every 30 minutes (00:00, 00:30, 01:00, ...)
    # Note: GitHub Actions scheduled events may experience minor queuing delays during peak hours.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      limit_per_feed:
        description: 'Number of articles to process per feed (default: 2)'
        required: false
        default: '2'
      dry_run:
        description: 'Dry run mode (fetch and summarize without writing to Firestore)'
        required: false
        type: boolean
        default: false
      force_publish:
        description: 'Force publish without holding for editorial review'
        required: false
        type: boolean
        default: false

# Least-privilege permissions: only read repository source code
permissions:
  contents: read

# Prevent overlapping concurrent runs to avoid duplicate news publishing & race conditions
concurrency:
  group: kabira-news-auto-publisher
  cancel-in-progress: false

jobs:
  auto-publish-news:
    name: Ingest RSS, Synthesize with Gemini & Publish to Firestore
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository source
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20 environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install project dependencies
        run: |
          npm ci --prefer-offline || npm install

      - name: 📰 Execute News Automation Engine
        env:
          # AI & Editorial Keys
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          # Firebase Admin Service Account (Recommended for secure server-side publishing)
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'tactile-sweep-464417-p2' }}
          FIREBASE_DATABASE_ID: ${{ secrets.FIREBASE_DATABASE_ID || 'ai-studio-kabiranews-7d7b1222-a3c8-46b5-b4a5-fea61b7ac7ed' }}

          # Fallback Firebase Web SDK credentials (if service account is not yet provided)
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_DATABASE_ID: ${{ secrets.VITE_FIREBASE_DATABASE_ID }}

          # WhatsApp Channel Broadcast Automation Secrets
          WHATSAPP_CHANNEL_WEBHOOK_URL: ${{ secrets.WHATSAPP_CHANNEL_WEBHOOK_URL }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_CHANNEL_ID: ${{ secrets.WHATSAPP_CHANNEL_ID }}
          WHATSAPP_API_URL: ${{ secrets.WHATSAPP_API_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # Workflow dispatch parameters
          LIMIT_PER_FEED: ${{ github.event.inputs.limit_per_feed || '2' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          FORCE_PUBLISH: ${{ github.event.inputs.force_publish || 'false' }}
        run: |
          echo "Starting Kabira News automated publication run..."
          npx tsx scripts/auto-publish.ts

      - name: 📄 Generate & Dispatch Daily 6-Page e-Paper PDF to WhatsApp
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'tactile-sweep-464417-p2' }}
          FIREBASE_DATABASE_ID: ${{ secrets.FIREBASE_DATABASE_ID || 'ai-studio-kabiranews-7d7b1222-a3c8-46b5-b4a5-fea61b7ac7ed' }}
          WHATSAPP_CHANNEL_WEBHOOK_URL: ${{ secrets.WHATSAPP_CHANNEL_WEBHOOK_URL }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_CHANNEL_ID: ${{ secrets.WHATSAPP_CHANNEL_ID }}
          WHATSAPP_API_URL: ${{ secrets.WHATSAPP_API_URL }}
        run: |
          echo "Generating 6-page e-Paper PDF & dispatching to WhatsApp Channel and +91 9893537306..."
          npx tsx scripts/generate-epaper.ts

